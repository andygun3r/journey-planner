name: mainline

services:
  # No host ports published here on purpose — this file is deployed as-is on
  # servers (Coolify included), where Postgres/Redis must stay off the public
  # network. For local host access (psql, redis-cli from the host) use
  # docker-compose.override.yml, auto-loaded by `docker compose` locally but
  # never picked up by a server deploy (Coolify points at this file directly).
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mainline
      POSTGRES_PASSWORD: mainline
      POSTGRES_DB: mainline
    # Ran entirely on defaults before this, which meant a 128MB shared_buffers
    # against multi-million-row tables under continuous write.
    #
    # max_connections is deliberately LOWER than the default 100. The app's
    # steady-state need is well under 40, and a leak that exhausts a small
    # ceiling fails loudly and early instead of quietly eating the last few
    # connections the ingest services needed. pg_stat_statements makes "which
    # query is expensive" answerable without guessing.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-60}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainline"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: ${PG_MEM_LIMIT:-2g}

  redis:
    image: redis:8-alpine
    # A hard ceiling inside Redis as well as on the container, so it refuses a
    # write before the kernel's OOM killer takes the whole process out.
    #
    # noeviction, NOT allkeys-lru. Today Redis only carries pub/sub, but once it
    # holds live train state (planned) an eviction policy would silently drop
    # trains under pressure and there would be no way to tell. A refused write
    # is a bug report; a missing train is a mystery.
    #
    # Snapshots off: there is no redis volume, so the default RDB writes went to
    # the container's own layer and were thrown away on every recreate. That was
    # disk I/O bought for nothing. If Redis later holds state worth keeping, add
    # a volume and turn this back on deliberately.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-384m}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_TILES_URL: ${NEXT_PUBLIC_TILES_URL:-http://localhost:8081}
    environment:
      DATABASE_URL: postgres://mainline:mainline@postgres:5432/mainline
      REDIS_URL: redis://redis:6379
      MOTIS_URL: http://motis:8080
      ETL_GTFS_OUT_DIR: /data/gtfs
      NEXT_PUBLIC_TILES_URL: ${NEXT_PUBLIC_TILES_URL:-http://localhost:8081}
      # Sign-in (Better Auth: passkey + magic link) — see .env.example.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Lets an unattended caller (etl-cron, see below) hit the ETL routes
      # without a human session — sent as the x-api-key header. An admin's own
      # session cookie also works for these routes; this is only for the
      # no-human-logged-in case.
      ETL_API_KEY: ${ETL_API_KEY:-}
      # Must match the actual motis container name/id on this host — Coolify
      # prefixes/suffixes compose project names, so verify with
      # `docker compose ps motis` and override here if it doesn't match.
      MOTIS_CONTAINER_NAME: ${MOTIS_CONTAINER_NAME:-mainline-motis-1}
      # Target for POST /api/etl/sftp-sync's on-demand SFTP pull (see
      # lib/etl-sftp-sync.ts) — same Coolify naming caveat as above, verify
      # with `docker compose ps etl-cron`.
      ETL_CRON_CONTAINER_NAME: ${ETL_CRON_CONTAINER_NAME:-mainline-etl-cron-1}
    ports:
      - "3000:3000"
    volumes:
      - gtfs-data:/data/gtfs
      # Landing spot for an uploaded raw DTD zip (see /api/etl/upload-raw) —
      # shared with etl-cron, which is the one that actually reads it (the
      # dtd2mysql conversion needs real memory, which this container doesn't
      # have — same reasoning as the SFTP sync path in etl-sftp-sync.ts).
      - dtd-archive:/data/dtd
      # Needed to reimport + restart motis after applying an uploaded
      # timetable bundle (MOTIS has no live-reload API) — same pattern as
      # etl-cron's reimport+restart.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1g

  # VERIFY ON FIRST INTEGRATION: image tag pullability and the import/server
  # invocation for this release (config.yml keys move between versions).
  # GHCR has no v2 version tags (they stop at 0.8.x); v2 ships as :latest.
  # Needs GTFS data at ./data/gtfs/gb-rail.gtfs.zip before it can serve —
  # run the etl profile once against this same host/volume first.
  motis:
    image: ghcr.io/motis-project/motis:latest
    # import writes ./data relative to config.yml (both live in /data),
    # so the server must resolve them from that working directory.
    working_dir: /data
    command: ["/motis", "server"]
    volumes:
      - motis-data:/data
      - gtfs-data:/input
    restart: unless-stopped
    # Sized for SERVING only. `motis import` — the memory-hungry preprocessing
    # step — deliberately runs as its own throwaway container (see
    # cron/motis-reimport.sh) rather than `docker exec` into this one, so it
    # gets its own budget and never competes with the live server for this
    # cgroup's memory. If you put the import back in here, raise this a lot.
    mem_limit: ${MOTIS_MEM_LIMIT:-2g}
    healthcheck:
      # MOTIS has no dedicated /health path; hitting any real API route and
      # accepting non-5xx confirms the HTTP server came up after import.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8080/api/v1/geocode?text=x 2>&1 | grep -qE 'HTTP/[0-9.]+ [1-4][0-9][0-9]'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Vector tile stack for the live map (/map): the full OpenRailwayMap-vector
  # project (https://github.com/hiddewie/OpenRailwayMap-vector), vendored as a
  # git submodule at vendor/openrailwaymap-vector — it is not a static style
  # over a generic tileset, it's its own Postgres/PostGIS import (osm2pgsql)
  # + Martin vector tile server + nginx proxy that serves the styled UI.
  # `orm-db` is dedicated to this stack — separate instance/schema from
  # Mainline's own `postgres` service, not shared.
  #
  # One-time manual setup before this can serve real tiles (orm-martin/
  # orm-proxy will come up fine beforehand, just with an empty database):
  #   1. Download a GB OSM extract (https://download.geofabrik.de/europe/great-britain.html)
  #      to vendor/openrailwaymap-vector/data/data.osm.pbf
  #   2. docker compose up -d orm-db
  #   3. docker compose --profile orm-import run --rm orm-import import
  #      (takes several minutes; re-run after refreshing data.osm.pbf later)
  #   4. docker compose up -d orm-martin orm-api orm-proxy
  # See vendor/openrailwaymap-vector/SETUP.md for the full upstream docs
  # (data update/refresh commands, SSL, etc).
  orm-db:
    build:
      context: vendor/openrailwaymap-vector/db
    shm_size: 1g
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /data/postgresql
      POSTGRES_DB: gis
    volumes:
      - orm-db-data:/data
    restart: unless-stopped
    mem_limit: 1g

  # Run-to-completion import: docker compose run --rm orm-import import
  # (re-run manually to pick up a refreshed data.osm.pbf; see SETUP.md).
  orm-import:
    build:
      context: vendor/openrailwaymap-vector
      dockerfile: import/Dockerfile
    profiles: ["orm-import"]
    depends_on:
      orm-db:
        condition: service_healthy
    volumes:
      - ./vendor/openrailwaymap-vector/data:/data
    environment:
      PGHOST: orm-db
      PGUSER: postgres

  orm-martin:
    build:
      context: vendor/openrailwaymap-vector
      dockerfile: martin.Dockerfile
    depends_on:
      orm-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres@orm-db:5432/gis
      POSTGRES_RELOAD_INTERVAL: 10s
    restart: unless-stopped
    mem_limit: 512m

  # Facility/milestone search API behind the proxy's /api path — the map
  # itself only needs tiles, but the proxy's nginx template hard-references
  # API_UPSTREAM, so this has to exist for the proxy to serve anything.
  orm-api:
    build:
      context: vendor/openrailwaymap-vector
      dockerfile: api.Dockerfile
    depends_on:
      orm-db:
        condition: service_healthy
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      POSTGRES_USER: postgres
      POSTGRES_HOST: orm-db
      POSTGRES_DB: gis
    restart: unless-stopped
    mem_limit: 256m

  # Serves the styled map UI + tiles on :8000 (see docker-compose.override.yml
  # for the host port publish) — this is what NEXT_PUBLIC_TILES_URL points at.
  orm-proxy:
    build:
      context: vendor/openrailwaymap-vector
      dockerfile: proxy.Dockerfile
    depends_on:
      - orm-martin
      - orm-api
    environment:
      TILES_UPSTREAM: orm-martin:3000
      API_UPSTREAM: orm-api:5000
      PUBLIC_PROTOCOL: http
      # The externally-reachable host:port browsers use to reach this proxy —
      # martin rewrites tile URLs in tilejson responses to match. Must equal
      # wherever orm-proxy:8000 is actually published/routed for this
      # environment (see docker-compose.override.yml for local dev's 8081).
      PUBLIC_HOST: ${ORM_PUBLIC_HOST:-localhost:8000}
      # Tile caching, on.
      #
      # These were all "0", which switched off both the nginx cache and the
      # browser's. The whole caching setup in proxy.conf.template — proxy_cache,
      # cache_lock, revalidate — was already there and doing nothing, so every
      # map pan re-rendered every tile from a PostGIS query. That is a standing
      # CPU cost for data that only changes when someone re-runs orm-import by
      # hand.
      #
      # A week is safe for the same reason. After an import, bump ORM_CACHE_TTL
      # down briefly or clear the cache volume if a change needs to show sooner.
      NGINX_CACHE_TTL: "${ORM_CACHE_TTL:-604800}"
      CLIENT_CACHE_TTL_ASSETS_FRESH: "${ORM_CACHE_TTL:-604800}"
      CLIENT_CACHE_TTL_ASSETS_STALE: "2592000"
      # The style/tilejson endpoints: cheap, but they carry the rewritten tile
      # URLs, so keep them fresher than the tiles themselves.
      CLIENT_CACHE_TTL_API_FRESH: "300"
      CLIENT_CACHE_TTL_API_STALE: "86400"
      CLIENT_CACHE_TTL_TILES_FRESH: "${ORM_CACHE_TTL:-604800}"
      CLIENT_CACHE_TTL_TILES_STALE: "2592000"
    restart: unless-stopped
    mem_limit: 256m

  # Run-to-completion ETL: docker compose --profile etl run --rm etl timetable
  # Writes into the same named `gtfs-data` volume MOTIS reads from, so on a
  # fresh host (Coolify included) this must be run at least once before MOTIS
  # has anything to serve. Source precedence (see src/index.ts): explicit
  # local zip arg > SFTP (if DTD_SFTP_HOST is set) > NRDP HTTPS download.
  etl:
    build:
      context: .
      dockerfile: services/etl/Dockerfile
    profiles: ["etl"]
    environment: &etl-env
      DATABASE_URL: postgres://mainline:mainline@postgres:5432/mainline
      ETL_MYSQL_URL: mysql://root:etl@mariadb:3306/dtd
      ETL_ARCHIVE_DIR: /data/dtd/archive
      ETL_GTFS_OUT_DIR: /data/gtfs
      NRDP_USERNAME: ${NRDP_USERNAME:-}
      NRDP_PASSWORD: ${NRDP_PASSWORD:-}
      # RDG SFTP delivery — separate account from NRDP_USERNAME/PASSWORD.
      # Set DTD_SFTP_HOST to switch the ETL from NRDP HTTPS to SFTP pull.
      DTD_SFTP_HOST: ${DTD_SFTP_HOST:-}
      DTD_SFTP_PORT: ${DTD_SFTP_PORT:-}
      DTD_SFTP_USERNAME: ${DTD_SFTP_USERNAME:-}
      DTD_SFTP_PASSWORD: ${DTD_SFTP_PASSWORD:-}
      DTD_SFTP_TIMETABLE_DIR: ${DTD_SFTP_TIMETABLE_DIR:-}
      DTD_SFTP_FARES_DIR: ${DTD_SFTP_FARES_DIR:-}
      # Network Rail reference/Track Model SFTP drops can share the same SFTP
      # account as DTD_SFTP_*; set NR_SFTP_* only when RDG provides separate
      # credentials or folders.
      NR_SFTP_HOST: ${NR_SFTP_HOST:-}
      NR_SFTP_PORT: ${NR_SFTP_PORT:-}
      NR_SFTP_USERNAME: ${NR_SFTP_USERNAME:-}
      NR_SFTP_PASSWORD: ${NR_SFTP_PASSWORD:-}
      NR_SFTP_TRACK_MODEL_DIR: ${NR_SFTP_TRACK_MODEL_DIR:-}
      NR_SFTP_DELETE_PROCESSED: ${NR_SFTP_DELETE_PROCESSED:-}
    volumes:
      - dtd-archive:/data/dtd
      - gtfs-data:/data/gtfs
    depends_on:
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Long-running counterpart to `etl` above: same image, but stays up and
  # fires the timetable pipeline nightly at 2am via the crontab baked into
  # the image (services/etl/cron/timetable-daily), then runs `motis import`
  # and restarts motis via the mounted docker socket so it serves the
  # refreshed GTFS (MOTIS has no live-reload API, and a restart alone does
  # NOT reimport — `motis server` just serves whatever's already preprocessed
  # under /data/data). Enable once SFTP/NRDP credentials are in place —
  # otherwise the nightly run just fails and retries the next night.
  etl-cron:
    build:
      context: .
      dockerfile: services/etl/Dockerfile
    environment:
      <<: *etl-env
      # Must match the actual motis container name/id on this host — Coolify
      # prefixes/suffixes compose project names, so verify with
      # `docker compose ps motis` and override here if it doesn't match.
      MOTIS_CONTAINER_NAME: ${MOTIS_CONTAINER_NAME:-mainline-motis-1}
    # dcron's setpgid(0,0) call at startup fails with EPERM when crond runs
    # as PID 1 (a session leader may never change its own process group).
    # Backgrounding it under a shell keeps crond as a non-leader child.
    entrypoint: ["sh", "-c", "crond -f -l 2 & wait"]
    volumes:
      - dtd-archive:/data/dtd
      - gtfs-data:/data/gtfs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Deliberately NOT capped. This container is idle 23h59m a day, then runs
    # the whole DTD conversion in one go — an OOM-killed timetable update at 2am
    # is far worse than an uncapped container that is asleep almost always.
    #
    # It and mariadb below are the two obvious candidates for coming off
    # always-on (that is 23 hours a day of a standing MariaDB for one nightly
    # job). Left alone on purpose: moving the schedule to a host cron or a
    # `docker compose --profile etl run` is an operational change, and getting
    # it wrong stops timetable updates silently.

  # MariaDB scratch for dtd2mysql only — canonical storage is Postgres.
  # Not profile-gated: etl-cron (a standing service) needs it always up.
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: etl
      MARIADB_DATABASE: dtd
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Generous on purpose. This is where dtd2mysql bulk-loads the whole CIF
    # extract, and that job is already the thing that runs the server out of
    # memory. A tight cap here starves exactly the work this container exists
    # to do. It sits idle the rest of the day, so the ceiling costs nothing
    # until the nightly run needs it.
    mem_limit: ${MARIADB_MEM_LIMIT:-4g}

  # Darwin real-time ingester (RDM Kafka -> Postgres + Redis pub/sub).
  # The board works without it (LDBWS is primary); this is the deep feed for
  # journey-wide live status and commute alerts. Needs RDM_KAFKA_* in .env.
  darwin-ingest:
    build:
      context: .
      dockerfile: services/darwin-ingest/Dockerfile
    environment:
      DATABASE_URL: postgres://mainline:mainline@postgres:5432/mainline
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: darwin-ingest
      # Corridor precompute resolves commute windows into serving trains via MOTIS.
      MOTIS_URL: http://motis:8080
      RDM_KAFKA_BOOTSTRAP_SERVERS: ${RDM_KAFKA_BOOTSTRAP_SERVERS:-}
      RDM_KAFKA_TOPIC: ${RDM_KAFKA_TOPIC:-}
      RDM_KAFKA_GROUP_ID: ${RDM_KAFKA_GROUP_ID:-}
      RDM_CONSUMER_KEY: ${RDM_CONSUMER_KEY:-}
      RDM_CONSUMER_SECRET: ${RDM_CONSUMER_SECRET:-}
      # Web Push (commute alerts). Generate once: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:alerts@mainline.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Progress, not liveness. The old check was `pgrep -f 'tsx src/index.ts'`,
      # which only proves a process exists — a consumer can sit there connected
      # and consuming nothing after a silent auth failure or a dropped
      # subscription, and this reported healthy throughout. The service touches
      # the heartbeat file as it works (see heartbeat.ts), so a stale mtime means
      # the feed has genuinely stopped and the container should be restarted.
      #
      # 5 minutes is generous on purpose: both feeds carry traffic around the
      # clock, but a quiet few minutes overnight must not cause a restart loop.
      # node, not `find -newermt`: these images are node:22-alpine, and busybox
      # find has no -newermt, so that check would fail forever and restart-loop
      # the container. node -e is already the pattern the web healthcheck uses.
      test:
        - CMD-SHELL
        - node -e "let m=0;try{m=require('fs').statSync(process.env.INGEST_HEARTBEAT_FILE||'/tmp/ingest-heartbeat').mtimeMs}catch{};process.exit(Date.now()-m<300000?0:1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    mem_limit: 768m

  # Network Rail ingester (TRUST movements over Network Rail STOMP + Train
  # Describer over RailData Kafka when NR_TD_KAFKA_* is configured, otherwise
  # TD falls back to STOMP). Adds between-station live positioning on top of
  # Darwin. Needs NETWORKRAIL_* in .env for TRUST. Load reference data first:
  #   docker compose run --rm nr-ingest node dist/index.js reference
  # Then the uid->headcode map (SCHEDULE feed, ~127MB, several minutes;
  # re-run periodically — daily is reasonable — since NR reissues SCHEDULE
  # daily and this table is a point-in-time snapshot):
  #   docker compose run --rm nr-ingest pnpm tsx src/index.ts headcodes
  nr-ingest:
    build:
      context: .
      dockerfile: services/nr-ingest/Dockerfile
    environment:
      DATABASE_URL: postgres://mainline:mainline@postgres:5432/mainline
      REDIS_URL: redis://redis:6379
      # Names this service's connections in pg_stat_activity, so a stray second
      # writer is identifiable at a glance rather than an anonymous postgres.js.
      SERVICE_NAME: nr-ingest
      NETWORKRAIL_USERNAME: ${NETWORKRAIL_USERNAME:-}
      NETWORKRAIL_PASSWORD: ${NETWORKRAIL_PASSWORD:-}
      NR_TRAJECTORY_MATCH: ${NR_TRAJECTORY_MATCH:-}
      NR_TD_KAFKA_BOOTSTRAP_SERVERS: ${NR_TD_KAFKA_BOOTSTRAP_SERVERS:-}
      NR_TD_KAFKA_TOPIC: ${NR_TD_KAFKA_TOPIC:-}
      NR_TD_KAFKA_GROUP_ID: ${NR_TD_KAFKA_GROUP_ID:-}
      NR_TD_KAFKA_USERNAME: ${NR_TD_KAFKA_USERNAME:-}
      NR_TD_KAFKA_PASSWORD: ${NR_TD_KAFKA_PASSWORD:-}
      # RDG SFTP delivery for SMARTExtract.*.gz and TPS_Data.tar.gz. Falls back
      # to DTD_SFTP_* credentials if NR_SFTP_* is unset.
      DTD_SFTP_HOST: ${DTD_SFTP_HOST:-}
      DTD_SFTP_PORT: ${DTD_SFTP_PORT:-}
      DTD_SFTP_USERNAME: ${DTD_SFTP_USERNAME:-}
      DTD_SFTP_PASSWORD: ${DTD_SFTP_PASSWORD:-}
      NR_SFTP_HOST: ${NR_SFTP_HOST:-}
      NR_SFTP_PORT: ${NR_SFTP_PORT:-}
      NR_SFTP_USERNAME: ${NR_SFTP_USERNAME:-}
      NR_SFTP_PASSWORD: ${NR_SFTP_PASSWORD:-}
      NR_SFTP_REFERENCE_DIR: ${NR_SFTP_REFERENCE_DIR:-}
      NR_SFTP_DELETE_PROCESSED: ${NR_SFTP_DELETE_PROCESSED:-}
      NR_TPS_DIR: ${NR_TPS_DIR:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nr-reference-data:/data
    healthcheck:
      # Progress, not liveness. The old check was `pgrep -f 'tsx src/index.ts'`,
      # which only proves a process exists — a consumer can sit there connected
      # and consuming nothing after a silent auth failure or a dropped
      # subscription, and this reported healthy throughout. The service touches
      # the heartbeat file as it works (see heartbeat.ts), so a stale mtime means
      # the feed has genuinely stopped and the container should be restarted.
      #
      # 5 minutes is generous on purpose: both feeds carry traffic around the
      # clock, but a quiet few minutes overnight must not cause a restart loop.
      # node, not `find -newermt`: these images are node:22-alpine, and busybox
      # find has no -newermt, so that check would fail forever and restart-loop
      # the container. node -e is already the pattern the web healthcheck uses.
      test:
        - CMD-SHELL
        - node -e "let m=0;try{m=require('fs').statSync(process.env.INGEST_HEARTBEAT_FILE||'/tmp/ingest-heartbeat').mtimeMs}catch{};process.exit(Date.now()-m<300000?0:1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    mem_limit: 768m

  # Periodic RDG SFTP sweep for Network Rail reference files delivered outside
  # the live STOMP feeds: SMARTExtract.*.gz and TPS_Data.tar.gz. The command
  # no-ops when no SFTP host is configured or no matching files are present;
  # successfully processed remote files are deleted by nr-ingest itself.
  nr-reference-sync:
    build:
      context: .
      dockerfile: services/nr-ingest/Dockerfile
    environment:
      DATABASE_URL: postgres://mainline:mainline@postgres:5432/mainline
      SERVICE_NAME: nr-reference-sync
      DTD_SFTP_HOST: ${DTD_SFTP_HOST:-}
      DTD_SFTP_PORT: ${DTD_SFTP_PORT:-}
      DTD_SFTP_USERNAME: ${DTD_SFTP_USERNAME:-}
      DTD_SFTP_PASSWORD: ${DTD_SFTP_PASSWORD:-}
      NR_SFTP_HOST: ${NR_SFTP_HOST:-}
      NR_SFTP_PORT: ${NR_SFTP_PORT:-}
      NR_SFTP_USERNAME: ${NR_SFTP_USERNAME:-}
      NR_SFTP_PASSWORD: ${NR_SFTP_PASSWORD:-}
      NR_SFTP_REFERENCE_DIR: ${NR_SFTP_REFERENCE_DIR:-}
      NR_SFTP_DELETE_PROCESSED: ${NR_SFTP_DELETE_PROCESSED:-}
      NR_TPS_DIR: ${NR_TPS_DIR:-}
      NR_REFERENCE_SYNC_INTERVAL_SECONDS: ${NR_REFERENCE_SYNC_INTERVAL_SECONDS:-21600}
    command:
      - sh
      - -c
      - |
        while true; do
          if [ -n "$${NR_SFTP_HOST:-$${DTD_SFTP_HOST:-}}" ]; then
            node dist/index.js reference-sftp || true
          else
            echo "[nr-reference-sync] no SFTP host configured"
          fi
          sleep "$${NR_REFERENCE_SYNC_INTERVAL_SECONDS:-21600}"
        done
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - nr-reference-data:/data
    restart: unless-stopped
    mem_limit: 384m

volumes:
  pgdata:
  motis-data:
  gtfs-data:
  dtd-archive:
  nr-reference-data:
  mariadb-data:
  orm-db-data:
