name: mainline

services:
  # No host ports published here on purpose — this file is deployed as-is on
  # servers (Coolify included), where Postgres/Redis must stay off the public
  # network. For local host access (psql, redis-cli from the host) use
  # docker-compose.override.yml, auto-loaded by `docker compose` locally but
  # never picked up by a server deploy (Coolify points at this file directly).
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mainline
      POSTGRES_PASSWORD: mainline
      POSTGRES_DB: mainline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainline"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgres://mainline:mainline@postgres:5432/mainline
      REDIS_URL: redis://redis:6379
      MOTIS_URL: http://motis:8080
      ETL_GTFS_OUT_DIR: /data/gtfs
      # Gates POST /api/etl/upload (see /settings/timetable) — required to
      # accept a bundle produced locally by `etl package`. Unset disables the
      # endpoint entirely (returns 503).
      ETL_UPLOAD_TOKEN: ${ETL_UPLOAD_TOKEN:-}
      # Must match the actual motis container name/id on this host — Coolify
      # prefixes/suffixes compose project names, so verify with
      # `docker compose ps motis` and override here if it doesn't match.
      MOTIS_CONTAINER_NAME: ${MOTIS_CONTAINER_NAME:-mainline-motis-1}
    ports:
      - "3000:3000"
    volumes:
      - gtfs-data:/data/gtfs
      # Needed to restart motis after applying an uploaded timetable bundle
      # (MOTIS has no live-reload API) — same pattern as etl-cron's restart.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # VERIFY ON FIRST INTEGRATION: image tag pullability and the import/server
  # invocation for this release (config.yml keys move between versions).
  # GHCR has no v2 version tags (they stop at 0.8.x); v2 ships as :latest.
  # Needs GTFS data at ./data/gtfs/gb-rail.gtfs.zip before it can serve —
  # run the etl profile once against this same host/volume first.
  motis:
    image: ghcr.io/motis-project/motis:latest
    # import writes ./data relative to config.yml (both live in /data),
    # so the server must resolve them from that working directory.
    working_dir: /data
    command: ["/motis", "server"]
    volumes:
      - motis-data:/data
      - gtfs-data:/input
    restart: unless-stopped
    healthcheck:
      # MOTIS has no dedicated /health path; hitting any real API route and
      # accepting non-5xx confirms the HTTP server came up after import.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8080/api/v1/geocode?text=x 2>&1 | grep -qE 'HTTP/[0-9.]+ [1-4][0-9][0-9]'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Run-to-completion ETL: docker compose --profile etl run --rm etl timetable
  # Writes into the same named `gtfs-data` volume MOTIS reads from, so on a
  # fresh host (Coolify included) this must be run at least once before MOTIS
  # has anything to serve. Source precedence (see src/index.ts): explicit
  # local zip arg > SFTP (if DTD_SFTP_HOST is set) > NRDP HTTPS download.
  etl:
    build:
      context: .
      dockerfile: services/etl/Dockerfile
    profiles: ["etl"]
    environment: &etl-env
      DATABASE_URL: postgres://mainline:mainline@postgres:5432/mainline
      ETL_MYSQL_URL: mysql://root:etl@mariadb:3306/dtd
      ETL_ARCHIVE_DIR: /data/dtd/archive
      ETL_GTFS_OUT_DIR: /data/gtfs
      NRDP_USERNAME: ${NRDP_USERNAME:-}
      NRDP_PASSWORD: ${NRDP_PASSWORD:-}
      # RDG SFTP delivery — separate account from NRDP_USERNAME/PASSWORD.
      # Set DTD_SFTP_HOST to switch the ETL from NRDP HTTPS to SFTP pull.
      DTD_SFTP_HOST: ${DTD_SFTP_HOST:-}
      DTD_SFTP_PORT: ${DTD_SFTP_PORT:-}
      DTD_SFTP_USERNAME: ${DTD_SFTP_USERNAME:-}
      DTD_SFTP_PASSWORD: ${DTD_SFTP_PASSWORD:-}
      DTD_SFTP_TIMETABLE_DIR: ${DTD_SFTP_TIMETABLE_DIR:-}
      DTD_SFTP_FARES_DIR: ${DTD_SFTP_FARES_DIR:-}
    volumes:
      - dtd-archive:/data/dtd
      - gtfs-data:/data/gtfs
    depends_on:
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Long-running counterpart to `etl` above: same image, but stays up and
  # fires the timetable pipeline nightly at 2am via the crontab baked into
  # the image (services/etl/cron/timetable-daily), then restarts motis via
  # the mounted docker socket so it reimports the refreshed GTFS (MOTIS has
  # no live-reload API). Enable once SFTP/NRDP credentials are in place —
  # otherwise the nightly run just fails and retries the next night.
  etl-cron:
    build:
      context: .
      dockerfile: services/etl/Dockerfile
    environment:
      <<: *etl-env
      # Must match the actual motis container name/id on this host — Coolify
      # prefixes/suffixes compose project names, so verify with
      # `docker compose ps motis` and override here if it doesn't match.
      MOTIS_CONTAINER_NAME: ${MOTIS_CONTAINER_NAME:-mainline-motis-1}
    entrypoint: ["crond", "-f", "-l", "2"]
    volumes:
      - dtd-archive:/data/dtd
      - gtfs-data:/data/gtfs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # MariaDB scratch for dtd2mysql only — canonical storage is Postgres.
  # Not profile-gated: etl-cron (a standing service) needs it always up.
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: etl
      MARIADB_DATABASE: dtd
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Darwin real-time ingester (RDM Kafka -> Postgres + Redis pub/sub).
  # The board works without it (LDBWS is primary); this is the deep feed for
  # journey-wide live status and commute alerts. Needs RDM_KAFKA_* in .env.
  darwin-ingest:
    build:
      context: .
      dockerfile: services/darwin-ingest/Dockerfile
    environment:
      DATABASE_URL: postgres://mainline:mainline@postgres:5432/mainline
      REDIS_URL: redis://redis:6379
      # Corridor precompute resolves commute windows into serving trains via MOTIS.
      MOTIS_URL: http://motis:8080
      RDM_KAFKA_BOOTSTRAP_SERVERS: ${RDM_KAFKA_BOOTSTRAP_SERVERS:-}
      RDM_KAFKA_TOPIC: ${RDM_KAFKA_TOPIC:-}
      RDM_KAFKA_GROUP_ID: ${RDM_KAFKA_GROUP_ID:-}
      RDM_CONSUMER_KEY: ${RDM_CONSUMER_KEY:-}
      RDM_CONSUMER_SECRET: ${RDM_CONSUMER_SECRET:-}
      # Web Push (commute alerts). Generate once: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:alerts@mainline.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'tsx src/index.ts' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Network Rail ingester (TRUST movements + Train Describer over STOMP ->
  # Postgres). Adds between-station live positioning on top of Darwin.
  # Needs NETWORKRAIL_* in .env. Load reference data first:
  #   docker compose run --rm nr-ingest pnpm tsx src/index.ts reference
  # Then the uid->headcode map (SCHEDULE feed, ~127MB, several minutes;
  # re-run periodically — daily is reasonable — since NR reissues SCHEDULE
  # daily and this table is a point-in-time snapshot):
  #   docker compose run --rm nr-ingest pnpm tsx src/index.ts headcodes
  nr-ingest:
    build:
      context: .
      dockerfile: services/nr-ingest/Dockerfile
    environment:
      DATABASE_URL: postgres://mainline:mainline@postgres:5432/mainline
      REDIS_URL: redis://redis:6379
      NETWORKRAIL_USERNAME: ${NETWORKRAIL_USERNAME:-}
      NETWORKRAIL_PASSWORD: ${NETWORKRAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'tsx src/index.ts' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  motis-data:
  gtfs-data:
  dtd-archive:
  mariadb-data:
